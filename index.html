<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#1F7A4C">
<meta name="description" content="냉장고 속 재료로 오늘 만들 수 있는 한국 집밥 레시피를 찾아 주는 앱">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="오늘 뭐 먹지?">
<title>오늘 뭐 먹지?</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="icon" href="assets/icon-192.png">
<style>
:root{
  color-scheme:light;
  --white:#FFFFFF; --ivory:#F8F6F1; --ivory-2:#F2EFE7;
  --green:#1F7A4C; --green-2:#2E8B57; --tint:#EBF5EF; --tint-2:#DCEFE4;
  --ink:#16211C; --ink-2:#3E4A43; --muted:#6E7C73; --line:#E9E6DD;
  --warm:#A45B33;
  --shadow-sm:0 2px 10px rgba(31,122,76,.07);
  --shadow:0 12px 34px rgba(22,52,38,.12);
  --r-xl:24px; --r-lg:20px; --r-md:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Pretendard","Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  background:#EEEBE3; color:var(--ink);
  display:flex; justify-content:center; min-height:100vh;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
#app{width:100%;max-width:430px;min-height:100vh;background:var(--white);position:relative;overflow-x:hidden;box-shadow:0 0 70px rgba(20,45,32,.10)}
button{font-family:inherit;font-size:inherit;border:0;background:none;color:inherit;padding:0;cursor:pointer;text-align:left}
img{display:block;max-width:100%}
h1,h2,h3,h4,p{margin:0}
a{color:var(--green);text-decoration:none}

/* ---------- header ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .2s ease}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar-row{display:flex;align-items:center;gap:11px;padding:13px 20px 12px}
.brand-mark{width:38px;height:38px;border-radius:13px;background:var(--tint);display:grid;place-items:center;flex:0 0 auto;color:var(--green)}
.brand-mark svg{width:22px;height:22px}
.brand-text{min-width:0}
.brand-title{font-size:17px;font-weight:800;letter-spacing:-.4px;line-height:1.25}
.brand-sub{font-size:11.5px;color:var(--muted);margin-top:2px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-btn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:var(--tint);color:var(--green);font-size:12px;font-weight:800;padding:9px 12px;border-radius:13px;flex:0 0 auto}
.top-btn svg{width:16px;height:16px}
.top-btn[hidden]{display:none}

/* ---------- views ---------- */
main{padding-bottom:118px}
.view{display:none;padding:6px 20px 24px;animation:fadeUp .26s ease both}
.view.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- hero ---------- */
.hero{position:relative;border-radius:var(--r-xl);overflow:hidden;margin-top:6px;box-shadow:var(--shadow);background:var(--ivory)}
.hero img{width:100%;height:188px;object-fit:cover}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,38,26,0) 34%,rgba(12,38,26,.76) 100%)}
.hero-text{position:absolute;left:18px;right:18px;bottom:16px;color:#fff}
.hero-kicker{font-size:10px;font-weight:800;letter-spacing:.16em;opacity:.86}
.hero-title{font-size:19px;font-weight:800;line-height:1.36;letter-spacing:-.5px;margin-top:6px}

/* ---------- cta ---------- */
.cta-card{margin-top:16px;background:linear-gradient(150deg,#F3F9F5 0%,var(--tint) 100%);border:1px solid #DCEBE2;border-radius:var(--r-xl);padding:19px 18px}
.cta-title{font-size:16.5px;font-weight:800;letter-spacing:-.4px}
.cta-desc{font-size:12.8px;color:var(--ink-2);margin:7px 0 13px;line-height:1.6}
.cta-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.mini-chip{font-size:11.5px;font-weight:700;background:#fff;border:1px solid #D9E8DF;color:var(--green);padding:5px 9px;border-radius:999px}
.mini-chip.muted{color:var(--muted);border-color:var(--line);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:16px;font-weight:800;font-size:14.5px;padding:14px 18px;letter-spacing:-.3px;transition:transform .12s ease,background .15s ease,opacity .15s ease}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--green);color:#fff;box-shadow:0 9px 20px rgba(31,122,76,.22)}
.btn-primary:active{background:#196440}
.btn-ghost{background:var(--ivory);color:var(--ink-2)}
.btn-block{width:100%}
.btn-danger{background:#FBEBE8;color:#B4402F}
.arw{font-weight:700;transform:translateY(-.5px)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--ivory);border-radius:var(--r-lg);padding:14px 6px;margin-top:14px;text-align:center}
.stat b{display:block;font-size:17px;font-weight:800;letter-spacing:-.5px}
.stat span{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;letter-spacing:-.2px}

/* ---------- section ---------- */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:26px 0 13px}
.sec-title{font-size:16.5px;font-weight:800;letter-spacing:-.4px}
.sec-sub{font-size:11.5px;color:var(--muted);margin-top:4px;letter-spacing:-.2px}
.sec-link{display:inline-flex;align-items:center;gap:2px;font-size:12.5px;font-weight:800;color:var(--green);flex:0 0 auto;padding-bottom:2px}
.sec-link svg{width:13px;height:13px}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .12s ease,box-shadow .18s ease}
.card:active{transform:scale(.985)}
.card-img{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--ivory-2)}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-body{padding:10px 11px 12px}
.card-name{font-size:13.5px;font-weight:800;letter-spacing:-.3px;line-height:1.32;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:11px;color:var(--muted);font-weight:600}
.dot{width:2px;height:2px;border-radius:50%;background:#CBD4CE;display:inline-block}
.pill-match{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.95);color:var(--green);font-size:10.5px;font-weight:800;padding:5px 9px;border-radius:999px;box-shadow:0 2px 8px rgba(15,40,28,.14)}
.fav-btn{position:absolute;right:7px;top:7px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#8A968F;box-shadow:0 2px 8px rgba(15,40,28,.10);transition:color .15s ease,transform .12s ease}
.fav-btn:active{transform:scale(.92)}
.fav-btn svg{width:17px;height:17px}
.fav-btn.on{color:var(--green)}
.fav-btn.on svg path{fill:currentColor}

/* ---------- recipe rows ---------- */
.rcard{display:flex;gap:12px;width:100%;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;margin-bottom:11px;transition:transform .12s ease,border-color .15s ease}
.rcard:active{transform:scale(.99);border-color:#D7E4DB}
.rcard-thumb{position:relative;width:92px;height:92px;flex:0 0 auto;border-radius:14px;overflow:hidden;background:var(--ivory-2)}
.rcard-thumb img{width:100%;height:100%;object-fit:cover}
.rcard-thumb .fav-btn{width:27px;height:27px;right:4px;top:4px;background:rgba(255,255,255,.9)}
.rcard-thumb .fav-btn svg{width:14px;height:14px}
.rcard-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px}
.rcard-top{display:flex;align-items:center;gap:7px}
.rcard-name{flex:1;min-width:0;font-size:14.5px;font-weight:800;letter-spacing:-.35px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:7px;background:var(--ivory);color:var(--ink-2);flex:0 0 auto;letter-spacing:-.2px}
.tag.green{background:var(--tint);color:var(--green)}
.meta-row{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600}
.pbar{height:4px;border-radius:3px;background:#EFF3EF;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green-2),var(--green));border-radius:3px}
.miss{font-size:11.5px;color:#9A6B4F;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.miss.ok{color:var(--green)}

/* ---------- search / filters ---------- */
.search-wrap{position:relative;display:flex;align-items:center;gap:9px;background:var(--ivory);border:1px solid var(--line);border-radius:16px;padding:0 14px;height:48px;margin:8px 0 12px;transition:border-color .15s ease,background .15s ease}
.search-wrap:focus-within{border-color:#BFDCCC;background:#fff;box-shadow:0 0 0 4px rgba(31,122,76,.06)}
.search-wrap svg{width:18px;height:18px;color:var(--muted);flex:0 0 auto}
.search-wrap input{flex:1;min-width:0;border:0;background:none;outline:none;font-family:inherit;font-size:14px;color:var(--ink);letter-spacing:-.2px}
.search-wrap input::placeholder{color:#939F97}
.search-wrap input::-webkit-search-cancel-button,.search-wrap input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.clear-btn{width:22px;height:22px;border-radius:50%;background:#DDE3DE;color:#fff;display:grid;place-items:center;flex:0 0 auto}
.clear-btn svg{width:12px;height:12px;color:#fff}

.filter-block{margin-bottom:10px}
.filter-label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin-bottom:7px}
.fchips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;font-size:12.5px;font-weight:700;padding:8px 13px;border-radius:11px;background:var(--ivory);color:var(--ink-2);border:1px solid transparent;letter-spacing:-.2px}
.fchip.on{background:var(--tint);color:var(--green);border-color:#C6E3D2}

.switch-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin:4px 0 14px;width:100%}
.switch-row .sw-text{flex:1;min-width:0}
.switch-row b{display:block;font-size:13.5px;font-weight:800;letter-spacing:-.3px}
.switch-row span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.switch{width:46px;height:27px;border-radius:999px;background:#E2E8E2;position:relative;transition:background .2s ease;flex:0 0 auto}
.switch i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .2s ease;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.switch.on{background:var(--green)}
.switch.on i{left:22px}

.count-line{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--muted);font-weight:700;margin:2px 2px 10px;letter-spacing:-.2px}
.count-line b{color:var(--green);font-weight:800}

/* ---------- ingredients ---------- */
.selbar{display:flex;align-items:center;justify-content:space-between;background:var(--tint);border-radius:14px;padding:11px 14px;margin-bottom:6px}
.sel-left{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.sel-left b{color:var(--green);font-size:15px;font-weight:800;margin-right:2px}
.link-btn{font-size:12px;font-weight:800;color:var(--green)}
.add-row{display:flex;align-items:center;gap:8px;width:100%;background:#fff;border:1px dashed #C6DACE;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13px;font-weight:700;color:var(--green)}
.add-row .plus{width:20px;height:20px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-size:14px;font-weight:800;line-height:1}
.cat{margin-bottom:16px}
.cat-head{display:flex;align-items:center;gap:7px;margin:0 0 9px 2px}
.cat-name{font-size:12px;font-weight:800;color:var(--ink-2);letter-spacing:-.1px}
.cat-num{font-size:11px;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:10px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:-.3px;transition:background .15s ease,color .15s ease,border-color .15s ease}
.chip .ck{width:13px;height:13px;opacity:0;transition:opacity .15s ease;margin-left:-1px}
.chip.on{background:var(--tint);border-color:#BFE0CD;color:var(--green)}
.chip.on .ck{opacity:1}
.chip.del{padding-right:9px}
.chip .x{width:15px;height:15px;border-radius:50%;background:#E7ECE8;color:#8A968F;display:grid;place-items:center;margin-left:1px}
.chip .x svg{width:9px;height:9px}
.empty-inline{font-size:12.5px;color:var(--muted);padding:8px 2px 4px;line-height:1.6}
.view-note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:18px;letter-spacing:-.2px}
.foot-note{font-size:11px;color:#8A968F;line-height:1.6;margin-top:26px;text-align:center;letter-spacing:-.2px}

/* ---------- floating cta ---------- */
.fab-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));width:100%;max-width:430px;padding:0 16px;z-index:28;pointer-events:none}
.fab{pointer-events:auto;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--green);color:#fff;font-size:14.5px;font-weight:800;padding:16px;border-radius:18px;box-shadow:0 12px 26px rgba(20,80,52,.28);letter-spacing:-.3px}
.fab:active{transform:scale(.985)}
.fab .n{background:rgba(255,255,255,.2);border-radius:999px;font-size:12px;padding:2px 8px;font-weight:800}
.fab[hidden]{display:none}

/* ---------- tabbar ---------- */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:5px 5px calc(5px + env(safe-area-inset-bottom));z-index:40}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;border-radius:14px;color:#7E8C83;font-size:10.5px;font-weight:800;letter-spacing:-.2px;transition:color .15s ease}
.tab-ic{width:36px;height:26px;border-radius:9px;display:grid;place-items:center;transition:background .15s ease}
.tab svg{width:21px;height:21px}
.tab.on{color:var(--green)}
.tab.on .tab-ic{background:var(--tint)}

/* ---------- sheet ---------- */
.backdrop{position:fixed;inset:0;background:rgba(15,32,24,.45);opacity:0;pointer-events:none;transition:opacity .26s ease;z-index:50}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,102%);width:100%;max-width:430px;height:88vh;height:92dvh;background:#fff;border-radius:26px 26px 0 0;z-index:60;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -18px 50px rgba(12,32,22,.22);transition:transform .32s cubic-bezier(.22,.9,.28,1)}
.sheet.open{transform:translate(-50%,0)}
.sheet-hero{position:relative;height:236px;flex:0 0 auto;background:var(--ivory-2)}
.sheet-hero img{width:100%;height:100%;object-fit:cover}
.sheet-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.16) 0%,rgba(0,0,0,0) 36%)}
.grabber{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:42px;height:4px;border-radius:3px;background:rgba(255,255,255,.75);z-index:3}
.sheet-close{position:absolute;top:13px;right:14px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;z-index:4;color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.12)}
.sheet-close svg{width:17px;height:17px}
.sheet-save{position:absolute;top:13px;right:58px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;z-index:4;color:#8A968F;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.sheet-save svg{width:18px;height:18px}
.sheet-save.on{color:var(--green)}
.sheet-save.on svg path{fill:currentColor}
.sheet-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:17px 20px calc(30px + env(safe-area-inset-bottom))}
.sheet-tags{display:flex;gap:6px;flex-wrap:wrap}
.sheet-title{font-size:22px;font-weight:800;letter-spacing:-.7px;margin:9px 0 7px;line-height:1.3}
.sheet-desc{font-size:13px;color:var(--ink-2);line-height:1.65}
.match-block{margin-top:15px;background:var(--ivory);border-radius:16px;padding:14px}
.match-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.match-top b{font-size:13.5px;font-weight:800;letter-spacing:-.3px}
.match-top .pc{font-size:13px;font-weight:800;color:var(--green)}
.match-block .pbar{margin-top:9px;height:5px;background:#E6EBE6}
.match-note{font-size:11.5px;color:var(--ink-2);margin-top:9px;line-height:1.5}
.match-note b{color:var(--warm);font-weight:800}
.blk-title{display:flex;align-items:center;justify-content:space-between;font-size:14.5px;font-weight:800;letter-spacing:-.35px;margin:24px 0 4px}
.blk-sub{font-size:11.5px;color:var(--muted);font-weight:700}
.ing-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #EFEDE6}
.ing-row:last-child{border-bottom:0}
.ing-check{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #E2E7E2;color:#CBD4CE;flex:0 0 auto}
.ing-check svg{width:12px;height:12px}
.ing-check.owned{background:var(--green);border-color:var(--green);color:#fff}
.ing-name{font-size:13.5px;font-weight:700;letter-spacing:-.2px}
.ing-row.lack .ing-name{color:#8E8579;font-weight:600}
.ing-amt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.step{display:flex;gap:11px;padding:10px 0;width:100%;align-items:flex-start;border-radius:12px;transition:background .15s ease}
.step:active{background:var(--ivory)}
.step-no{width:25px;height:25px;border-radius:50%;background:var(--ivory);color:var(--ink-2);font-size:11.5px;font-weight:800;display:grid;place-items:center;flex:0 0 auto;margin-top:1px;border:1.5px solid transparent;transition:all .15s ease}
.step.done .step-no{background:var(--tint);color:var(--green);border-color:#BFE0CD}
.step-text{font-size:13.5px;line-height:1.66;color:var(--ink-2);letter-spacing:-.2px;transition:color .15s ease}
.step.done .step-text{color:#AAB5AD;text-decoration:line-through;text-decoration-color:#CBD4CE}
.step-hint{font-size:10.5px;color:#8A968F;margin-left:auto;flex:0 0 auto;margin-top:3px;font-weight:700}
.tip-box{margin-top:18px;background:#FCF7EC;border:1px solid #F0E4CC;border-radius:14px;padding:13px 14px;font-size:12.5px;line-height:1.62;color:#7A6134;letter-spacing:-.2px}
.tip-box b{display:block;font-size:11px;color:#A07F3E;letter-spacing:.04em;margin-bottom:4px;font-weight:800}
.done-note{margin-top:16px;text-align:center;font-size:12px;color:var(--green);font-weight:800}
.src-box{margin-top:14px;display:flex;align-items:center;gap:10px;background:#F4F7F5;border:1px solid #E1EAE4;border-radius:14px;padding:11px 13px}
.src-ico{font-size:17px;line-height:1}
.src-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.src-text b{font-size:10.5px;color:#7C8B82;letter-spacing:.04em;font-weight:800}
.src-text span{font-size:12.5px;color:#3F4C45;font-weight:700;letter-spacing:-.2px}
.src-link{flex:none;font-size:11.5px;font-weight:800;color:var(--green);text-decoration:none;white-space:nowrap}
.src-link:active{opacity:.6}

/* ---------- saved / settings ---------- */
.page-title{font-size:20px;font-weight:800;letter-spacing:-.6px;margin:10px 0 4px}
.page-sub{font-size:12.5px;color:var(--muted);line-height:1.6}
.empty{text-align:center;padding:44px 14px 10px}
.empty-art{width:86px;height:86px;border-radius:30px;background:var(--tint);display:grid;place-items:center;margin:0 auto 16px;color:var(--green)}
.empty-art svg{width:38px;height:38px}
.empty b{display:block;font-size:15px;font-weight:800;letter-spacing:-.3px}
.empty p{font-size:12.5px;color:var(--muted);line-height:1.65;margin:7px 0 18px}
.set-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.set-row{display:flex;align-items:center;gap:12px}
.set-row .set-text{flex:1;min-width:0}
.set-row b{display:block;font-size:14px;font-weight:800;letter-spacing:-.3px}
.set-row span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.set-btn{font-size:12px;font-weight:800;color:var(--green);background:var(--tint);padding:9px 12px;border-radius:11px;flex:0 0 auto}
.set-divide{height:1px;background:var(--line);margin:14px 0}
.seg{display:flex;gap:6px;margin-top:13px;background:var(--ivory);border-radius:13px;padding:4px}
.seg button{flex:1;font-size:12.5px;font-weight:800;color:var(--muted);padding:9px 4px;border-radius:10px;text-align:center;letter-spacing:-.2px}
.seg button.on{background:#fff;color:var(--green);box-shadow:var(--shadow-sm)}
.info-list{font-size:11.5px;color:var(--muted);line-height:1.75;letter-spacing:-.2px}
.info-list b{color:var(--ink-2)}
.badge-ver{display:inline-block;font-size:10.5px;font-weight:800;color:var(--green);background:var(--tint);padding:3px 7px;border-radius:7px;margin-left:6px;vertical-align:1px}

/* ---------- dialog / toast ---------- */
.dlg-back{position:fixed;inset:0;background:rgba(15,32,24,.45);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:70}
.dlg-back.show{opacity:1;pointer-events:auto}
.dialog{position:fixed;top:50%;left:50%;transform:translate(-50%,-46%) scale(.97);width:calc(100% - 56px);max-width:330px;background:#fff;border-radius:22px;padding:22px 20px 16px;z-index:71;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;box-shadow:0 24px 60px rgba(12,32,22,.3)}
.dialog.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.dialog h3{font-size:16px;font-weight:800;letter-spacing:-.4px}
.dialog p{font-size:12.5px;color:var(--muted);line-height:1.62;margin:8px 0 18px}
.dlg-actions{display:flex;gap:8px}
.dlg-actions .btn{flex:1;font-size:13.5px;padding:12px}
.toast{position:fixed;bottom:calc(150px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,10px);background:#1B2A22;color:#fff;font-size:12.5px;font-weight:700;padding:11px 17px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease;z-index:80;white-space:nowrap;max-width:calc(100% - 40px);overflow:hidden;text-overflow:ellipsis;box-shadow:0 10px 24px rgba(12,32,22,.24)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:360px){
  .view{padding-left:16px;padding-right:16px}
  .topbar-row{padding-left:16px;padding-right:16px}
  .hero img{height:168px}
}
@media (prefers-reduced-motion:reduce){

function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (Array.isArray(d.custom)) {
      state.custom = d.custom.filter(function (c) { return c && c.name && c.id; }).slice(0, 60);
    }
    const known = {};
    INGREDIENTS.forEach(function (i) { known[i.id] = true; });
    state.custom.forEach(function (c) { known[c.id] = true; });
    if (Array.isArray(d.ingredients)) {
      const seen = {};
      state.ingredients = d.ingredients.filter(function (id) {
        if (!known[id] || seen[id]) return false;
        seen[id] = true;
        return true;
      });
    }
    if (Array.isArray(d.saved)) {
      state.saved = d.saved.filter(function (id) { return !!REC_BY_ID[id]; });
    }
    if (d.steps && typeof d.steps === "object") {
      const clean = {};
      Object.keys(d.steps).forEach(function (rid) {
        if (REC_BY_ID[rid] && Array.isArray(d.steps[rid])) {
          const len = REC_BY_ID[rid].steps.length;
          const seen = {};
          clean[rid] = d.steps[rid].filter(function (n) {
            if (typeof n !== "number" || n < 0 || n >= len || seen[n]) return false;
            seen[n] = true;
            return true;
          });
        }
      });
      state.steps = clean;
    }
    if (d.prefs && [0, 15, 30].indexOf(d.prefs.maxTime) !== -1) {
      state.prefs.maxTime = d.prefs.maxTime;
      state.filters.time = d.prefs.maxTime;
    }
  } catch (e) { /* 저장된 값이 없거나 깨졌으면 기본값으로 시작 */ }
}
function persist() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      ingredients: state.ingredients,
      custom: state.custom,
      saved: state.saved,
      steps: state.steps,
      prefs: state.prefs
    }));
  } catch (e) { /* 저장 공간을 쓸 수 없어도 화면은 계속 동작 */ }
}

function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s) {
  return String(s).split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;")
    .split('"').join("&quot;").split("'").join("&#39;");
}
function allIngredients() {
  const list = INGREDIENTS.slice();
  state.custom.forEach(function (c) {
    list.push({ id: c.id, name: c.name, cat: "custom", custom: true });
  });
  return list;
}
function nameOf(id) {
  if (ING_BY_ID[id]) return ING_BY_ID[id].name;
  for (let i = 0; i < state.custom.length; i++) {
    if (state.custom[i].id === id) return state.custom[i].name;
  }
  return id;
}
function isPantry(id) { return !!(ING_BY_ID[id] && ING_BY_ID[id].pantry); }
function has(id) { return state.ingredients.indexOf(id) !== -1; }
function matchOf(r) {
  const req = r.ing.filter(function (x) { return !isPantry(x.id); });
  const owned = req.filter(function (x) { return has(x.id); });
  const missing = req.filter(function (x) { return !has(x.id); });
  const total = req.length;
  return {
    total: total,
    owned: owned.length,
    missing: missing,
    pct: total ? Math.round((owned.length / total) * 100) : 100
  };
}
function isSaved(id) { return state.saved.indexOf(id) !== -1; }

function recommendedByMatch(n) {
  const scored = RECIPES.map(function (r) { return { r: r, m: matchOf(r) }; });
  scored.sort(function (a, b) {
    return (b.m.pct - a.m.pct) || (b.m.owned - a.m.owned) || (a.r.time - b.r.time);
  });
  return scored.slice(0, n).map(function (x) { return x.r; });
}
function dailyOrder() {
  let seed = Math.floor(Date.now() / 86400000) % 2147483647;
  if (seed <= 0) seed = 12345;
  const arr = RECIPES.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    seed = (seed * 48271) % 2147483647;
    const j = seed % (i + 1);
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;

function recipeScores() {
  let list = RECIPES.slice();
  const q = state.filters.q.trim();
  if (q) {
    list = list.filter(function (r) {
      if (r.name.indexOf(q) !== -1) return true;
      if (r.cat.indexOf(q) !== -1) return true;
      return r.ing.some(function (x) { return nameOf(x.id).indexOf(q) !== -1; });
    });
  }
  if (state.filters.diff !== "all") {
    list = list.filter(function (r) { return r.diff === state.filters.diff; });
  }
  if (state.filters.time) {
    list = list.filter(function (r) { return r.time <= state.filters.time; });
  }
  const scored = list.map(function (r) { return { r: r, m: matchOf(r) }; });
  if (state.filters.onlyReady && state.ingredients.length) {
    const only = scored.filter(function (x) { return x.m.missing.length === 0; });
    return only;
  }
  if (state.ingredients.length) {
    scored.sort(function (a, b) {
      return (b.m.pct - a.m.pct) || (b.m.owned - a.m.owned) || (a.r.time - b.r.time);
    });
  } else {
    scored.sort(function (a, b) { return a.r.time - b.r.time; });
  }
  return scored;
}

let sheetPushed = false;
function openSheet(id) {
  if (!REC_BY_ID[id]) return;
  state.openRecipe = id;
  renderSheet();
  $("#sheet").classList.add("open");
  $("#backdrop").classList.add("show");
  document.documentElement.style.overflow = "hidden";
  try { history.pushState({ sheet: id }, "", "#recipe"); sheetPushed = true; } catch (e) { sheetPushed = false; }
}
function closeSheet(skipHistory) {
  state.openRecipe = null;
  $("#sheet").classList.remove("open");
  $("#backdrop").classList.remove("show");
  document.documentElement.style.overflow = "";
  if (!skipHistory && sheetPushed) {
    sheetPushed = false;
    try { history.back(); } catch (e) { }
  } else {
    sheetPushed = false;
  }
}

/* ===================== 확인 대화상자 ===================== */
let dlgCb = null;
function askConfirm(title, body, okText, cb) {
  $("#dlgTitle").textContent = title;
  $("#dlgBody").textContent = body;
  $("#dlgOk").textContent = okText;
  dlgCb = cb;
  $("#dialog").classList.add("show");
  $("#dlgBack").classList.add("show");
}
function hideDialog() {
  $("#dialog").classList.remove("show");
  $("#dlgBack").classList.remove("show");
  dlgCb = null;
}

/* ===================== 탭 / 헤더 ===================== */
function updateHeader() {
  const h = HEAD[state.tab] || HEAD.home;
  $("#brandTitle").textContent = h.t;
  $("#brandSub").textContent = h.s;
  $("#topBtn").hidden = state.tab !== "home";
  $("#fab").hidden = state.tab !== "ingredients";
  renderIngFAB();
}
function renderTab(tab) {
  if (tab === "home") renderHome();
  else if (tab === "ingredients") renderIngredients();
  else if (tab === "recipes") renderRecipes();
  else if (tab === "saved") renderSaved();
  else if (tab === "settings") renderSettings();
}
function setTab(tab, silent) {
  state.tab = tab;
  $$(".view").forEach(function (v) { v.classList.toggle("active", v.id === "view-" + tab); });
  $$(".tab").forEach(function (b) {
    const on = b.getAttribute("data-tab") === tab;
    b.classList.toggle("on", on);
    if (on) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
  updateHeader();
  renderTab(tab);
  window.scrollTo(0, 0);
  if (!silent) {
    try { history.replaceState({ tab: tab }, "", "#" + tab); } catch (e) { }
  }
}

/* ===================== 동작 ===================== */
function toggleIngredient(id) {
  if (!nameOf(id) || nameOf(id) === id) { return; }
  const idx = state.ingredients.indexOf(id);
  if (idx === -1) state.ingredients.push(id);
  else state.ingredients.splice(idx, 1);
  persist();
}
function addCustom(name) {
  const clean = name.trim().slice(0, 12);
  if (!clean) { toast("재료 이름을 입력해 주세요"); return; }
  const exist = allIngredients().filter(function (i) { return i.name === clean; })[0];
  if (exist) {
    if (!has(exist.id)) {
      state.ingredients.push(exist.id);
      persist();
      toast("‘" + clean + "’ 재료를 담았어요");
    } else {
      toast("이미 담은 재료예요");
    }
    state.filters.inq = "";
    $("#inq").value = "";
    renderIngredients();
    return;
  }
  const id = "c:" + clean;
  if (!state.custom.some(function (c) { return c.id === id; })) {
    state.custom.push({ id: id, name: clean });
  }
  if (!has(id)) state.ingredients.push(id);
  persist();
  state.filters.inq = "";
  $("#inq").value = "";
  $("#inqClear").hidden = true;
  renderIngredients();
  toast("‘" + clean + "’ 재료를 추가했어요");
}
function toggleSave(id) {
  const idx = state.saved.indexOf(id);
  if (idx === -1) {
    state.saved.unshift(id);
    toast("레시피를 저장했어요");
  } else {
    state.saved.splice(idx, 1);
    toast("저장을 해제했어요");
  }
  persist();
  $$('[data-act="save"][data-id="' + id + '"]').forEach(function (b) {
    const on = isSaved(id);
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", String(on));
  });
  const sb = $('[data-act="sheet-save-btn"]');
  if (sb && sb.getAttribute("data-id") === id) {
    sb.textContent = isSaved(id) ? "저장한 레시피예요" : "이 레시피 저장하기";
  }
  if (state.tab === "saved") renderSaved();
}

document.addEventListener("click", function (e) {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.getAttribute("data-act");
  const id = t.getAttribute("data-id");

  if (act === "tab") { closeSheetIfOpen(); setTab(t.getAttribute("data-tab")); return; }
  if (act === "go-ingredients") { setTab("ingredients"); return; }
  if (act === "go-recipes") { setTab("recipes"); return; }
  if (act === "fab-recipes") {
    if (!state.ingredients.length) { toast("먼저 재료를 골라 주세요"); return; }
    state.filters.onlyReady = false;
    setTab("recipes");
    toast("내 재료로 만들 수 있는 레시피예요");
    return;
  }
  if (act === "ing") {
    toggleIngredient(id);
    renderIngredients();
    return;
  }
  if (act === "ing-clear") {
    state.ingredients = [];
    persist();
    renderIngredients();
    toast("선택한 재료를 모두 해제했어요");
    return;
  }
  if (act === "ing-add") { addCustom(state.filters.inq); return; }
  if (act === "ing-del") {
    const cid = id;
    state.custom = state.custom.filter(function (c) { return c.id !== cid; });
    state.ingredients = state.ingredients.filter(function (x) { return x !== cid; });
    persist();
    renderIngredients();
    return;
  }
  if (act === "inq-clear") {
    state.filters.inq = "";
    $("#inq").value = "";
    $("#inqClear").hidden = true;
    renderIngredients();
    $("#inq").focus();
    return;
  }
  if (act === "rq-clear") {
    state.filters.q = "";
    $("#rq").value = "";
    $("#rqClear").hidden = true;
    renderRecList();
    $("#rq").focus();
    return;
  }
  if (act === "f-diff") {
    state.filters.diff = t.getAttribute("data-v");
    renderRecFilters();
    renderRecList();
    return;
  }
  if (act === "f-time") {
    state.filters.time = Number(t.getAttribute("data-v"));
    renderRecFilters();
    renderRecList();
    return;
  }
  if (act === "f-ready") {
    if (!state.ingredients.length) {
      toast("먼저 식재료 탭에서 재료를 골라 주세요");
      return;
    }
    state.filters.onlyReady = !state.filters.onlyReady;
    renderRecFilters();
    renderRecList();
    return;
  }
  if (act === "f-reset") {
    state.filters.q = "";
    state.filters.diff = "all";
    state.filters.time = 0;
    state.filters.onlyReady = false;
    $("#rq").value = "";
    $("#rqClear").hidden = true;
    renderRecipes();
    toast("필터를 초기화했어요");
    return;
  }
  if (act === "open") { openSheet(id); return; }
  if (act === "close-sheet") { closeSheet(false); return; }
  if (act === "save" || act === "sheet-save-btn") { toggleSave(id); return; }
  if (act === "step") {
    const i = Number(t.getAttribute("data-i"));
    if (!state.steps[id]) state.steps[id] = [];
    const arr = state.steps[id];
    const k = arr.indexOf(i);
    if (k === -1) arr.push(i);
    else arr.splice(k, 1);
    persist();
    t.classList.toggle("done", k === -1);
    t.setAttribute("aria-pressed", String(k === -1));
    const hint = t.querySelector(".step-hint");
    if (hint) hint.parentNode.removeChild(hint);
    if (k === -1) {
      const sp = document.createElement("span");
      sp.className = "step-hint";
      sp.textContent = "완료";
      t.appendChild(sp);
    }
    const r = REC_BY_ID[id];
    const prog = $("#stepProg");
    if (prog && r) prog.textContent = arr.length + " / " + r.steps.length + " 단계";
    const dn = $("#doneNote");
    if (dn && r) dn.style.display = arr.length === r.steps.length ? "" : "none";
    return;
  }
  if (act === "set-time") {
    const v = Number(t.getAttribute("data-v"));
    state.prefs.maxTime = v;
    state.filters.time = v;
    persist();
    renderSettings();
    toast(v ? "기본 조리시간을 " + v + "분 이내로 설정했어요" : "모든 조리시간을 보여 드릴게요");
    return;
  }
  if (act === "reset-ing") {
    if (!state.ingredients.length && !state.custom.length) { toast("초기화할 재료가 없어요"); return; }
    askConfirm("선택한 식재료를 초기화할까요?", "지금 담아 둔 " + state.ingredients.length + "개의 재료와 직접 추가한 재료가 모두 사라져요. 저장한 레시피는 그대로 남아요.", "초기화", function () {
      state.ingredients = [];
      state.custom = [];
      persist();
      renderSettings();
      toast("식재료를 초기화했어요");
    });
    return;
  }
  if (act === "reset-saved") {
    if (!state.saved.length) { toast("초기화할 레시피가 없어요"); return; }
    askConfirm("저장한 레시피를 초기화할까요?", "저장한 " + state.saved.length + "개의 레시피가 모두 사라져요. 되돌릴 수 없어요.", "초기화", function () {
      state.saved = [];
      persist();
      renderSettings();
      toast("저장한 레시피를 초기화했어요");
    });
    return;
  }
  if (act === "dlg-cancel") { hideDialog(); return; }
  if (act === "dlg-ok") {
    const cb = dlgCb;
    hideDialog();
    if (cb) cb();
    return;
  }
});

function closeSheetIfOpen() {
  if ($("#sheet").classList.contains("open")) closeSheet(true);
}

document.addEventListener("input", function (e) {
  const el = e.target;
  if (el.id === "inq") {
    state.filters.inq = el.value;
    $("#inqClear").hidden = !el.value;
    renderIngredients();
  } else if (el.id === "rq") {
    state.filters.q = el.value;
    $("#rqClear").hidden = !el.value;
    renderRecList();
  }
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    if (e.target.id === "inq") {
      e.preventDefault();
      const q = state.filters.inq.trim();
      if (!q) return;
      addCustom(q);
      return;
    }
    if (e.target.id === "rq") {
      e.preventDefault();
      e.target.blur();
      return;
    }
    const t = e.target.closest("[data-act]");
    if (t && t.tagName !== "BUTTON" && t.getAttribute("role") === "button") {
      e.preventDefault();
      t.click();
    }
  }
  if (e.key === "Escape" && $("#sheet").classList.contains("open")) {
    closeSheet(false);
  }
});
$("#backdrop").addEventListener("click", function () { closeSheet(false); });
$("#dlgBack").addEventListener("click", function () { hideDialog(); });

window.addEventListener("popstate", function () {
  if ($("#sheet").classList.contains("open")) {
    closeSheet(true);
  } else {
    const h = (location.hash || "").replace("#", "");
    if (HEAD[h] && h !== state.tab) setTab(h, true);
  }
});
window.addEventListener("scroll", function () {
  const tb = $("#topbar");
  if (tb) tb.classList.toggle("scrolled", window.scrollY > 4);
}, { passive: true });

/* ===================== 시작 ===================== */
(function init() {
  loadState();
  const h = (location.hash || "").replace("#", "");
  const start = HEAD[h] ? h : "home";
  setTab(start, true);
})();
</script>
</body>
</html>
